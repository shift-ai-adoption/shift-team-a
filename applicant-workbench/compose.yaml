name: applicant-workbench
x-penpot: &penpot
  PENPOT_PUBLIC_URI: http://localhost:9001
  PENPOT_FLAGS: enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies disable-telemetry disable-onboarding disable-dashboard-templates-section
services:
  penpot-local-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports: ["127.0.0.1:4400:4400", "127.0.0.1:4401:4401", "127.0.0.1:4402:4402"]
    restart: unless-stopped
  app:
    build: .
    ports: ["127.0.0.1:3200:3200"]
    volumes: ["app-data:/app/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  penpot-frontend:
    image: penpotapp/frontend:2.15.4
    ports: ["127.0.0.1:9001:8080"]
    environment: *penpot
    depends_on: [penpot-backend, penpot-exporter]
    restart: unless-stopped
  penpot-backend:
    image: penpotapp/backend:2.15.4
    environment:
      <<: *penpot
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Run scripts/setup.ps1}
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: s3
      PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: http://minio:9000
      PENPOT_OBJECTS_STORAGE_S3_BUCKET: penpot
      AWS_ACCESS_KEY_ID: penpot-local
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Run scripts/setup.ps1}
      AWS_REGION: us-east-1
      PENPOT_TELEMETRY_ENABLED: "false"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      penpot-postgres: {condition: service_healthy}
      penpot-valkey: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    restart: unless-stopped
  penpot-exporter:
    image: penpotapp/exporter:2.15.4
    environment:
      PENPOT_PUBLIC_URI: http://localhost:9001
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
    depends_on: [penpot-valkey]
    restart: unless-stopped
  penpot-postgres:
    image: postgres:15.13-bookworm
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["penpot-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  penpot-valkey:
    image: valkey/valkey:8.1.3
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: penpot-local
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: ["penpot-assets:/data"]
    restart: unless-stopped
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'until mc alias set local http://minio:9000 penpot-local "$$MINIO_PASSWORD"; do sleep 2; done; mc mb --ignore-existing local/penpot'
volumes:
  app-data:
  penpot-db:
  penpot-assets:
