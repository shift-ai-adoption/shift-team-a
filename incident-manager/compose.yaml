services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - incident_data:/var/lib/postgresql/data
      - ./db/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  web:
    build: .
    environment:
      DATABASE_URL: postgres://incidents:local-development-only@db:5432/incidents
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:3100:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [entry, private]
networks:
  entry:
  private:
    internal: true
volumes:
  incident_data:
